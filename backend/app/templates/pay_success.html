<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful — WaveBook</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" type="image/png" href="/static/img/icon.png">
</head>
<body>
  <div class="navbar">
    <div class="container">
      <a href="/" class="brand"><img src="/static/img/icon.png" alt="WaveBook" class="brand-icon"></a>
    </div>
  </div>
  <section class="section">
    <div class="container" style="max-width: 560px;">
      <div class="card" style="text-align:center;">
        <div style="font-size:3rem;">✅</div>
        <h2 style="margin: 12px 0;">Payment Successful</h2>
        {% if kind == 'sms' %}
        <p style="color: var(--muted);">Your SMS credits have been added. Open the WaveBook app to see your updated balance.</p>
        {% else %}
        <p style="color: var(--muted);">Your payment was successful.</p>
        {% endif %}
        <a href="/" class="btn" style="margin-top: 20px;">Back to Home</a>
      </div>
    </div>
  </section>
  <div class="footer">
    <div class="container"><p>&copy; 2026 NeuroWaves Data Systems. All rights reserved.</p><p style="margin-top: 8px;">Support: <a href="mailto:support@getwavebook.com">support@getwavebook.com</a></p></div>
  </div>
</body>
</html>
