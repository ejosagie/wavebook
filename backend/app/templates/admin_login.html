<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — WaveBook</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" type="image/png" href="/static/img/icon.png">
</head>
<body>
  <div class="navbar">
    <div class="container">
      <a href="/" class="brand"><img src="/static/img/icon.png" alt="WaveBook" class="brand-icon"> Admin</a>
      <nav class="nav-links"><a href="/">View Site</a></nav>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="form-container">
        <div class="card" style="text-align:center;">
          <h2 style="margin-bottom: 16px;">Admin Login</h2>
          {% if error %}
          <p style="color: var(--danger); margin-bottom: 12px;">{{ error }}</p>
          {% endif %}
          <form method="post" action="/admin/login">
            <div class="form-group">
              <label>Admin password</label>
              <input type="password" name="password" placeholder="Enter admin password" required autofocus>
            </div>
            <button type="submit" class="btn" style="width:100%;">Sign In</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <div class="footer">
    <div class="container"><p>&copy; 2026 NeuroWaves Data Systems. All rights reserved.</p><p style="margin-top: 8px;">Support: <a href="mailto:support@getwavebook.com">support@getwavebook.com</a></p></div>
  </div>
</body>
</html>
